name: Comprobar ITV cada 5min

on:
  workflow_dispatch:        # Permite ejecución manual desde la interfaz

# Evita que dos ejecuciones simultáneas se pisen al guardar el estado.
concurrency:
  group: itv-check
  cancel-in-progress: true

# Permite al workflow re-ingresar state.json al repositorio con el
# GITHUB_TOKEN, para que el estado de citas ya notificadas persista
# entre ejecuciones.
permissions:
  contents: write

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    env:
      PLATE:            ${{ secrets.PLATE }}
      CENTERS:          ${{ secrets.CENTERS }}
      TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ITV script
        run: python itv_check.py

      # El script solo escribe state.json cuando la comprobación (y el
      # envío, si lo hubo) terminan bien; si falla, no hay cambios.
      - name: Persistir estado de citas notificadas
        if: always()
        run: |
          if [ ! -f state.json ]; then
            echo "Sin state.json que guardar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "El estado no ha cambiado; nada que subir."
          else
            git commit -m "chore: actualizar estado de citas notificadas"
            git push
          fi
